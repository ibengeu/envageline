services:
  evangeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evangeline
    ports:
      - "8880:8880"
    volumes:
      - models:/models
    environment:
      KOKORO_DEFAULT_VOICE: af_heart
      KOKORO_MODEL_DIR: /models
    restart: unless-stopped

volumes:
  models:
