# /etc/systemd/system/evangeline.service.d/memory.conf
#
# OWASP A06:2025 Insecure Design - keep the Kokoro narration service from
# starving the other apps on this server if its memory ever runs away again
# (it leaked ~4.4 MB per sentence until September 2026).
#
# Normal use is ~0.7 GB of Kokoro's own memory plus ~0.3 GB of model-file cache.
# MemoryHigh: above this the kernel reclaims Kokoro's cache first and slows it.
# MemoryMax:  hard ceiling - systemd kills Kokoro alone and Restart=always
#             brings it back in 5 s (in-flight narration fails and the reader
#             asks the listener to try again).
# MemorySwapMax=0: never let Kokoro push itself (and the server) into swap.
[Service]
MemoryHigh=1200M
MemoryMax=1600M
MemorySwapMax=0
