# evangeline.heraldsqr.com - the Evangeline reader (Node, pm2 "evangeline-reader"
# on 127.0.0.1:3002) with narration proxied to Kokoro (evangeline.service on
# 127.0.0.1:8880). Installed to /opt/bitnami/nginx/conf/server_blocks/.

# OWASP A06:2025 Insecure Design - narration is CPU-heavy and public; cap it per
# client so one visitor or script cannot starve everyone else.
limit_req_zone $binary_remote_addr zone=evangeline_tts:10m rate=3r/s;

server {
    listen 80;
    server_name evangeline.heraldsqr.com;

    location /.well-known/acme-challenge/ {
        root /opt/bitnami/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name evangeline.heraldsqr.com;

    ssl_certificate     /opt/bitnami/letsencrypt/certificates/evangeline.heraldsqr.com.crt;
    ssl_certificate_key /opt/bitnami/letsencrypt/certificates/evangeline.heraldsqr.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Visitors reach this site through Cloudflare. Take the visitor's address
    # from CF-Connecting-IP - trusted only when the request itself comes from a
    # Cloudflare range (https://www.cloudflare.com/ips/), so it cannot be spoofed
    # by calling the origin directly. The narration rate limit and the logs then
    # see real visitors instead of a handful of Cloudflare edges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    access_log /opt/bitnami/nginx/logs/evangeline_access.log;
    error_log  /opt/bitnami/nginx/logs/evangeline_error.log warn;

    # Narration: only Kokoro's speech and voice endpoints are public.
    location /v1/audio/ {
        limit_req            zone=evangeline_tts burst=20 nodelay;
        limit_req_status     429;
        client_max_body_size 32k;
        proxy_pass           http://127.0.0.1:8880;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   120s;
    }

    # Everything else is the reader app.
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
