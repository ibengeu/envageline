# detekt 1.23.8 embeds a Kotlin compiler environment that cannot parse a JDK 25
# version string, so the Gradle daemon runs on JDK 17. Module compilation still
# targets the Kotlin toolchain declared in each build script, so this pins the
# analyser's runtime only, not the produced bytecode.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
org.gradle.jvmargs=-Xmx2g

# AndroidX is the only support library line; the legacy one is unmaintained.
android.useAndroidX=true
